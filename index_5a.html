<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Házi Feladat – 5.a osztaly</title>
<style>
:root{--ink:#1a1d27;--ink2:#4b5063;--bg:#f7f8fc;--card:#fff;--line:#e4e7f0;--blue:#2f6de1;--blue-bg:#eef3fd;--green:#1a9e5c;--amber:#c47f00;--red:#d93025;--r:13px;--sh:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.hdr{background:var(--blue);color:#fff;padding:14px 16px 11px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(47,109,225,.3)}
.hdr h1{font-size:17px;font-weight:800;letter-spacing:-.2px}.hdr .sub{font-size:11px;opacity:.75;margin-top:1px}
.hdr-btn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:64px;z-index:99;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:11px 10px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.view{display:none;padding:14px 14px 96px}.view.on{display:block}
/* Search bar */
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:10px 13px;border:2px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.search-bar input:focus{outline:none;border-color:var(--blue)}
/* Chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer}
.card:active{outline:2px solid var(--blue)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.subj{font-weight:800;font-size:15px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ok{background:#d1fae5;color:var(--green)}.soon{background:#fef3c7;color:var(--amber)}.past{background:#fee2e2;color:var(--red)}.nodue{background:#f3f4f6;color:var(--ink2)}.type-temaзaro{background:#fef3c7;color:#92400e;border:1.5px solid #f59e0b}.type-dolgozat{background:#ede9fe;color:#5b21b6}.type-projekt{background:#d1fae5;color:#065f46}.type-anyag{background:#e0f2fe;color:#075985}
.desc{font-size:14px;color:#374151;margin-top:6px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.tag{font-size:11px;background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:10px;font-weight:600}
.who{font-size:11px;color:var(--ink2);margin-left:auto}
.thumbs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.thumb-more{width:58px;height:58px;border-radius:8px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--blue);border:1px solid var(--line)}
/* FAB */
.fab{position:fixed;bottom:22px;right:18px;width:56px;height:56px;border-radius:50%;background:#e55a10;color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(229,90,16,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.fab:active{transform:scale(.93)}
/* Overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:300;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:16px 16px 44px;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}}
.handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:18px;font-weight:900;margin-bottom:14px}
/* Login */
.login-screen{display:none;position:fixed;inset:0;background:var(--blue);z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-screen.on{display:flex}
.login-box{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:400px}
.login-logo{font-size:52px;text-align:center;margin-bottom:8px}
.login-title{font-size:22px;font-weight:900;text-align:center;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--ink2);text-align:center;margin-bottom:22px;line-height:1.5}
/* Form */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--blue)}
.field textarea{resize:vertical;min-height:72px}
/* Image picker */
.pick-btns{display:flex;gap:9px;margin-bottom:10px}
.pick-btn{flex:1;padding:13px 8px;border-radius:11px;border:2px dashed var(--line);background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick-btn:active{border-color:var(--blue);color:var(--blue)}
.pick-btn .ico{font-size:24px}
.prev-grid{display:grid;grid-template-columns:repeat(auto-fill,78px);gap:8px;margin-top:2px}
.prev-wrap{position:relative}
.prev-wrap img{width:78px;height:78px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.prev-rm{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px;display:none}
.progress-fill{height:100%;background:var(--blue);width:0;transition:width .3s}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:800;border:none;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-danger{background:var(--red);color:#fff}.btn-full{width:100%}.btn-row{display:flex;gap:9px;margin-top:12px}
/* Messenger */
.msg-box{background:#f0f2f5;border-radius:11px;padding:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#1c1e21;margin-bottom:12px;border:1px solid #dde0e4}
.fb-copy{width:100%;padding:13px;background:#1877f2;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:9px;display:flex;align-items:center;justify-content:center;gap:8px}
/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:11px}
.gallery-wrap{position:relative;display:block}
.gallery-wrap img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;cursor:pointer;display:block;background:var(--bg)}
.gallery-rm{position:absolute;top:4px;right:4px;background:rgba(220,48,37,.85);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* Trash */
.trash-card{background:#fff8f8;border-radius:var(--r);padding:13px 14px;margin-bottom:9px;border:1px solid #fecaca;box-shadow:var(--sh)}
.trash-meta{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.7}
.tbtn{flex:1;padding:10px 8px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid}
.tbtn-restore{background:#f0fdf4;border-color:var(--green);color:var(--green)}
.tbtn-perm{background:#fff5f5;border-color:var(--red);color:var(--red)}
/* Toast */
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(14px);background:#111827;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:600;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:17px;height:17px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}.empty .ico{font-size:42px;margin-bottom:10px}
.sec-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin-bottom:9px}
.detail-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.info-row{font-size:12px;color:var(--ink2);margin-bottom:6px}
.upload-status{font-size:13px;color:var(--ink2);margin-top:6px;min-height:18px}
.existing-imgs{margin-bottom:8px}
.existing-imgs label{display:block;font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
/* Export btn */
.export-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border:2px solid var(--line);border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;margin-bottom:12px}
.card.selected{outline:3px solid var(--blue);background:#f0f7ff}
.select-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--blue);color:#fff;padding:14px 16px;z-index:250;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -2px 12px rgba(47,109,225,.3)}
.select-bar.on{display:flex}
.select-bar .cnt{font-size:14px;font-weight:800}
.sb-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
.help-section{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}




.ocr-btn:active{opacity:.7}

.help-icon{font-size:28px;flex-shrink:0;width:40px;text-align:center}
.help-title{font-size:15px;font-weight:800;margin-bottom:4px}
.help-desc{font-size:13px;color:var(--ink2);line-height:1.6}
.date-filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px;scrollbar-width:none}
.date-filter-bar::-webkit-scrollbar{display:none}
.sel-btn{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.sel-btn.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.export-btn:active{border-color:var(--blue);color:var(--blue)}
.req-section{margin-bottom:16px}
.req-section h3{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.req-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.req-chip{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s}
.req-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.req-preview{background:#f0f2f5;border-radius:11px;padding:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#1c1e21;margin-bottom:12px;border:1px solid #dde0e4;min-height:80px}
.export-btn:active{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>

<div class="login-screen on" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📚</div>
    <div class="login-title">5.a osztaly</div>
    <div class="login-sub">Írd be a neved és a PIN-kódot</div>
    <div class="field"><label>Neved</label><input type="text" id="pinName" placeholder="Pl. Kiss Eva" autocomplete="name"></div>
    <div class="field"><label>PIN-kod</label><input type="password" id="pinCode" placeholder="••••" inputmode="numeric"></div>
    <button class="btn btn-primary btn-full" id="loginBtn">Belépés</button>
    <p id="loginErr" style="color:var(--red);font-size:13px;margin-top:10px;text-align:center;display:none"></p>
  </div>
</div>

<header class="hdr">
  <div><h1>📚 Házi Feladatok</h1><div class="sub">5.a osztaly</div></div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="hdrName" style="font-size:12px;opacity:.85"></span>
    <button class="hdr-btn" onclick="loadSheet()">🔄</button>
    <button class="hdr-btn" id="logoutBtn">↩</button>
  </div>
</header>

<nav class="tabs">
  <div class="tab on" id="tab-list">📋 Feladatok</div>
  <div class="tab" id="tab-request">🙋 Kérés</div>
  <div class="tab" id="tab-trash">🗑️ Kuka</div>
  <div class="tab" id="tab-help">❓ Súgó</div>
</nav>

<div id="view-list" class="view on">
  <div class="search-bar"><input type="search" id="searchList" placeholder="🔍 Keresés…" oninput="renderList()"></div>
  <div class="chips" id="filterBar"></div>
  <div class="date-filter-bar" id="dateFilterBar"></div>
  <div id="dateRangePicker" style="display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <input type="date" id="dateFrom" style="padding:7px 10px;border:2px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;color:var(--ink)" onchange="applyDateRange()">
    <span style="font-size:13px;color:var(--ink2)">–</span>
    <input type="date" id="dateTo" style="padding:7px 10px;border:2px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;color:var(--ink)" onchange="applyDateRange()">
    <button onclick="applyDateRange()" style="padding:7px 10px;border:2px solid var(--blue);border-radius:10px;font-size:12px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer">Szűrés</button>
    <button onclick="clearDateRange()" style="padding:7px 10px;border:2px solid var(--line);border-radius:10px;font-size:12px;font-weight:700;background:#fff;color:var(--ink2);cursor:pointer">✕ Törlés</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <div>
    <button class="sel-btn" id="selectModeBtn" onclick="toggleSelectMode()">☑️ Kijelölés</button>
    <div id="selectHint" style="font-size:11px;color:var(--ink2);margin-top:3px;display:none">📱 Mobilon: tartsd nyomva a kártyát</div>
  </div>
  </div>
  <div id="hwList"></div>
</div>
<div id="view-help" class="view"><div id="helpContent"></div></div>
<div class="select-bar" id="selectBar">
  <div style="display:flex;flex-direction:column;gap:10px;width:100%">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="cnt" id="selectCount">0 kijelölve</div>
      <div style="display:flex;gap:8px">
        <button class="sb-btn" onclick="selectAll()">☑️ Mind</button>
        <button class="sb-btn" onclick="selectNone()">☐ Semmi</button>
        <button class="sb-btn" onclick="cancelSelect()">✕ Kész</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="selectActions">
      <button class="sb-btn" style="flex:1" onclick="sendSelected()">💬 Küldés</button>
      <button class="sb-btn" style="flex:1" onclick="copySelected()">📋 Másolás</button>
      <button class="sb-btn" style="flex:1" onclick="exportSelectedExcel()">📥 Excel</button>
      <button class="sb-btn" style="flex:1" onclick="printSelected()">🖨️ Nyomtatás</button>
    </div>
  </div>
</div>



<div id="view-request" class="view"><div id="requestContent"></div></div>
<div id="view-trash" class="view"><div id="trashList"></div></div>

<button class="fab" id="fabBtn">＋</button>

<!-- ADD/EDIT SHEET -->
<div class="overlay" id="addSheet">
<div class="sheet">
  <div class="handle"></div>
  <div class="sheet-title" id="addSheetTitle">Új házi feladat</div>
  <div class="field"><label>Tantárgy</label><select id="newSubject">      <option>Magyar irodalom</option>
      <option>Magyar nyelv</option>
      <option>Matematika</option>
      <option>Természettudomány</option>
      <option>Angol</option>
      <option>Német</option>
      <option>Hittan – katolikus</option>
      <option>Hittan – református</option>
      <option>Hittan – evangélikus</option>
      <option>Történelem</option>
      <option>Digitális kultúra</option>
      <option>Testnevelés</option>
      <option>Ének-zene</option>
      <option>Vizuális kultúra</option>
      <option>Technika és tervezés</option>
      <option>Közösségi nevelés</option>
      <option>Egyéb</option></select></div>
  <div class="field"><label>Feladat leírása</label><textarea id="newDesc" placeholder="Pl. Munkafüzet 34. oldal, 2-5. feladat"></textarea></div>
  <div class="field"><label>Típus</label>
    <select id="newType">
      <option value="">Házi feladat</option>
      <option value="temaзaro">⚠️ Témazáró</option>
      <option value="dolgozat">📝 Dolgozat</option>
      <option value="projekt">🎯 Projekt</option>
      <option value="anyag">📖 Tanulnivaló anyag</option>
      <option value="orai">📝 Órai anyag</option>
    </select>
  </div>
  <div class="field"><label>Határidő (opcionális)</label><input type="date" id="newDue"></div>
  <div class="field"><label>Megjegyzés (opcionális)</label><input type="text" id="newNote" placeholder="Pl. kell a füzet is"></div>
  <div class="field">
    <label>Képek</label>
    <div class="existing-imgs" id="existingImgs" style="display:none">
      <label>Jelenlegi képek (X = töröl):</label>
      <div class="prev-grid" id="existingGrid"></div>
    </div>
    <div class="pick-btns">
      <div class="pick-btn" id="camBtn"><span class="ico">📷</span><span>Fénykép<br>készítése</span></div>
      <div class="pick-btn" id="galleryBtn"><span class="ico">🖼️</span><span>Meglévő<br>kép</span></div>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="galleryInput" accept="image/*" multiple style="display:none">
    <div class="prev-grid" id="prevGrid"></div>
    <div class="upload-status" id="uploadStatus"></div>
    <div class="progress" id="progressWrap"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" style="flex:1" id="cancelAddBtn">Mégse</button>
    <button class="btn btn-primary" style="flex:2" id="saveBtn">Mentés ✓</button>
  </div>
</div>
</div>

<!-- DETAIL SHEET -->
<div class="overlay" id="detailSheet">
<div class="sheet"><div class="handle"></div><button onclick="closeSheet('detailSheet');history.replaceState(null,'',window.location.pathname+window.location.search)" style="position:absolute;top:12px;right:16px;background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center">✕</button><div id="detailContent"></div></div>
</div>

<!-- NOTIFY SHEET -->
<div class="overlay" id="notifySheet">
<div class="sheet">
  <div class="handle"></div>
  <div class="sheet-title">💬 Messenger üzenet</div>
  <p style="font-size:13px;color:var(--ink2);margin-bottom:11px;">Másold ki és illeszd be a csoportba:</p>
  <div class="msg-box" id="notifyText"></div>
  <button class="fb-copy" id="copyBtn">📋 Másolás vágólapra</button>
  <button class="fb-copy" id="messengerBtn" style="background:#0084ff;margin-top:8px">💬 Megnyitás Messengerben</button>
  <button class="btn btn-secondary btn-full" id="closeNotifyBtn">Bezárás</button>
</div>
</div>

<!-- IMAGE VIEWER LIGHTBOX -->

// ── Helpers ──────────────────────────────────────────
function slugify(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_').toLowerCase();}
function safeJSON(s){
  if(!s||s==='[]'||s==='""'||s==='')return[];
  // Clean up if wrapped in extra quotes
  let str = String(s).trim();
  if(str.startsWith('"['))str=str.slice(1,-1);
  try{const r=JSON.parse(str);return Array.isArray(r)?r:[];}catch{return[];}
}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dueInfo(ds){
  if(!ds||ds==='')return{text:'Nincs határidő',cls:'nodue'};
  const d=new Date(ds);if(isNaN(d))return{text:'?',cls:'nodue'};
  d.setHours(0,0,0,0);
  const diff=Math.round((d-today0())/864e5);
  if(diff<0)return{text:'Lejárt',cls:'past'};
  if(diff===0)return{text:'Ma!',cls:'soon'};
  if(diff===1)return{text:'Holnap',cls:'soon'};
  if(diff<=3)return{text:diff+' nap',cls:'soon'};
  return{text:fmtDate(ds),cls:'ok'};
}
function fmtDate(s){if(!s)return'–';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleDateString('hu-HU',{month:'short',day:'numeric',weekday:'short'});}
function fmtDT(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleString('hu-HU',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ── JSONP request ─────────────────────────────────────
async function sheetRequest(params){
  const base = CFG.SCRIPT_URL + '?sheetId=' + encodeURIComponent(CFG.SHEET_ID);
  const qs = Object.entries(params).map(([k,v])=>
    encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v)
  ).join('&');
  const url = base + '&' + qs + '&t=' + Date.now();
  
  try {
    const r = await fetch(url, {redirect:'follow'});
    const text = await r.text();
    const data = JSON.parse(text);
    if(data.version) document.getElementById('scriptVersion').textContent='Script v'+data.version;
    return data;
  } catch(e) {
    // Fallback: try JSONP
    return new Promise((resolve,reject)=>{
      const cbName='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const cbUrl = url + '&callback=' + cbName;
      window[cbName]=(data)=>{
        delete window[cbName];
        try{document.head.removeChild(script);}catch(e){}
        if(data.version) document.getElementById('scriptVersion').textContent='Script v'+data.version;
        resolve(data);
      };
      const script=document.createElement('script');
      script.src=cbUrl;
      script.onerror=()=>{delete window[cbName];try{document.head.removeChild(script);}catch(e){}reject(new Error('Script hiba'));};
      setTimeout(()=>{if(window[cbName]){delete window[cbName];try{document.head.removeChild(script);}catch(e){}reject(new Error('Timeout'));}},20000);
      document.head.appendChild(script);
    });
  }
}

async function loadSheet(){
  showToast('⏳ Betöltés…',99999);

  try{

    const r=await fetch(url);

    // Google returns: /*O_o*/\ngoogle.visualization.Query.setResponse({...});
    const json=JSON.parse(text.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    homeworks=parseGViz(json);
    localStorage.setItem('hz_hw_5a',JSON.stringify(homeworks));
  }catch(e){
    console.warn('GViz load failed:',e);
    const cached=localStorage.getItem('hz_hw_5a');
    homeworks=cached?JSON.parse(cached):[];
    console.log('Cache loaded: '+homeworks.length+' items, first uploaded: '+(homeworks[0]?homeworks[0].uploaded:'none'));
    if(homeworks.length) showToast('⚠️ Offline – helyi adatok');
  }
  hideToast();renderAll();
  resolve();
  });
}

function parseGViz(json){
  try{
    const rows=json.table.rows;
    return rows.map(row=>{
      const get=(i)=>{
        const c=row.c&&row.c[i];
        if(!c||c.v==null)return '';
        // GViz returns dates as "Date(2026,9,11)" - convert to YYYY-MM-DD
        const v=String(c.v);
        const dm=v.match(/^Date\((\d+),(\d+),(\d+)\)$/);
        if(dm){
          const y=dm[1],m=String(+dm[2]+1).padStart(2,'0'),d=String(dm[3]).padStart(2,'0');
          return y+'-'+m+'-'+d;
        }
        return v;
      };
      const images=safeJSON(get(7));
      return{
        id:get(0),subject:get(1),desc:get(2),due:get(3),
        note:get(4),uploader:get(5),uploaded:get(6),
        images:images,cloudFolder:get(8)||''
      };
    }).filter(h=>h.id&&h.id!=='id');
  }catch(e){console.error('parseGViz error:',e);return[];}
}

// ── Cloudinary ───────────────────────────────────────
async function uploadToCloudinary(file,subject,dateStr,idx){
  const folder=`${CFG.CLOUD_FOLDER}/${slugify(subject)}${dateStr?'_'+dateStr:''}`;
  const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
  const fname = `${slugify(subject)}${dateStr?'_'+dateStr:''}_${idx||1}.${ext}`;
  // Rename file before upload to get correct filename
  const safeName = slugify(subject)+(dateStr?'_'+dateStr:'')+'_'+(idx||1)+'.'+file.name.split('.').pop().toLowerCase();
  const renamedFile = new File([file], safeName, {type: file.type});
  const fd=new FormData();
  fd.append('file',renamedFile);
  fd.append('upload_preset',CFG.UPLOAD_PRESET);
  fd.append('folder',folder);
  fd.append('use_filename','true');
  fd.append('unique_filename','false');
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.status);}
  const j=await r.json();
  return{url:j.secure_url,publicId:j.public_id,folder};
}

// ── Export Excel ──────────────────────────────────────
function exportExcel(mode){
  // Use currently filtered/visible items
  let items=[...homeworks];
  if(activeFilter==='__fav__')items=items.filter(h=>isFav(h.id));
  else if(activeFilter!=='all')items=items.filter(h=>h.subject===activeFilter);
  items=items.filter(passesDateFilter);
  const q=document.getElementById('searchList')?.value?.toLowerCase()||'';
  if(q)items=items.filter(h=>h.subject.toLowerCase().includes(q)||h.desc.toLowerCase().includes(q)||(h.note||'').toLowerCase().includes(q));
  items.sort((a,b)=>new Date(b.uploaded)-new Date(a.uploaded));
  let csv = 'Tantárgy,Feladat,Határidő,Megjegyzés,Feltöltötte,Feltöltve,Képek száma\n';
  items.forEach(h=>{
    const row=[
      h.subject, h.desc, h.due||'', h.note||'', h.uploader,
      fmtDT(h.uploaded), (h.images||[]).length
    ].map(v=>'"'+String(v).replace(/"/g,'""')+'"');
    csv+=row.join(',')+'\n';
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`hazik_${CFG.CNAME.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('📥 Exportálva!');
}

const TYPE_LABELS={'temaзaro':'⚠️ Témazáró','dolgozat':'📝 Dolgozat','projekt':'🎯 Projekt','anyag':'📖 Anyag','orai':'📝 Órai anyag'};

function cardHTML(h,selMode=false){
  const checked = selectedIds.has(h.id);
  const chk = selMode ? `<span style="width:22px;height:22px;border-radius:6px;border:2px solid ${checked?'var(--blue)':'var(--line)'};background:${checked?'var(--blue)':'#fff'};display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px;transition:all .15s">${checked?'<svg width=\"13\" height=\"13\" viewBox=\"0 0 13 13\"><polyline points=\"2,7 5,10 11,3\" fill=\"none\" stroke=\"white\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>':''}</span>` : '';

  const{text,cls}=dueInfo(h.due);
  const imgs=Array.isArray(h.images)?h.images.slice(0,3):[];
  const extra=Array.isArray(h.images)?h.images.length-3:0;
  const isPast=h.due&&new Date(h.due)<today0();
  const typeLabel=h.type&&TYPE_LABELS[h.type]?`<span class="badge type-${h.type}" style="margin-left:4px">${TYPE_LABELS[h.type]}</span>`:'';
  return`<div class="card" data-id="${h.id}" style="${isPast?'opacity:.65;':''}${h.type==='temaзaro'?'border-left:4px solid #f59e0b;':''}${h.type==='dolgozat'?'border-left:4px solid #7c3aed;':''}">
    <div class="card-head">
      ${chk}<div class="subj">${h.subject}${typeLabel}</div>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">${isFav(h.id)?'<span style="font-size:14px;line-height:1">❤️</span>':''}<div class="badge ${cls}">${text}</div></div>
    </div>
    <div class="desc">${h.desc}</div>
    ${imgs.length?`<div class="thumbs">${imgs.map(u=>`<img class="thumb" src="${u}" loading="lazy" onerror="this.style.display='none'">`).join('')}${extra>0?`<div class="thumb-more">+${extra}</div>`:''}</div>`:''}
    <div class="meta">
      ${h.note?`<span class="tag">📌 ${h.note}</span>`:''}
      ${imgs.length?`<span class="tag">🖼️ ${h.images.length}</span>`:''}
      <span class="who">⬆️ ${h.uploader} · ${fmtDT(h.uploaded)}</span>
    </div>
  </div>`;
}

async function downloadImg(url, idx){
  try{
    showToast('⏳ Letöltés…', 99999);
    const r = await fetch(url);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hazi_kep_${idx}.jpg`;
    a.click();
    hideToast();
    showToast('✅ Letöltve!');
  }catch(e){
    hideToast();
    // Fallback: open in new tab
    window.open(url, '_blank');
  }
}

async function downloadAll(imgs){
  if(!imgs||!imgs.length)return;
  showToast('⏳ Letöltés folyamatban…', 99999);
  for(let i=0;i<imgs.length;i++){
    await downloadImg(imgs[i], i+1);
    if(i<imgs.length-1) await new Promise(r=>setTimeout(r,800));
  }
  hideToast();
  showToast('✅ Összes letöltve!');
}

    if(hasSubjs){
      if(reqSubjects.length===1) msg+=' a(z) '+reqSubjects[0];
      else msg+=' a következő tantárgyak: '+reqSubjects.join(', ');
    } else {
      msg+=' a házi feladatokat';
    }
    // Days
    if(hasDays){
      const labels=reqDays.map(ds=>new Date(ds).toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'}));

async function sendToMessenger(text){
  // 1. Copy to clipboard
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);

  // 2. Try Web Share API (iOS Safari, Android Chrome) - native share sheet WITH text
  if(navigator.share && (isIOS || isAndroid)){
    try{
      await navigator.share({ text: text });
      return; // user handled it
    }catch(e){
      // User cancelled or not supported - fall through
      if(e.name==='AbortError') return;
    }
  }

  // 3. Desktop: open messenger.com
  showToast('📋 Szöveg másolva! Illeszd be Messengerbe.');
  window.open('https://www.messenger.com', '_blank');
}


// ── Lightbox ──────────────────────────────────────────
let lbImages = [];
let lbIndex  = 0;
let lbTouchStartX = 0;
let lbTouchStartY = 0;

function openLightbox(imgs, idx){
  lbImages = imgs;
  lbIndex  = idx;
  const el = document.getElementById('imgViewer');
  el.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  lbRender();
  // Touch swipe
  const wrap = document.getElementById('lbImgWrap');
  wrap.ontouchstart = e => { lbTouchStartX = e.touches[0].clientX; lbTouchStartY = e.touches[0].clientY; };
  wrap.ontouchend   = e => {
    const dx = e.changedTouches[0].clientX - lbTouchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - lbTouchStartY);
    if(Math.abs(dx) > 40 && dy < 60){
      lbMove(dx < 0 ? 1 : -1);
    }
  };
  // Click outside image closes
  document.getElementById('imgViewer').onclick = e => {
    if(e.target === document.getElementById('imgViewer') || e.target === document.getElementById('lbImgWrap')) closeLightbox();
  };
  // Keyboard
  document.onkeydown = e => {
    if(e.key==='ArrowRight') lbMove(1);
    else if(e.key==='ArrowLeft') lbMove(-1);
    else if(e.key==='Escape') closeLightbox();
  };
}

function closeLightbox(){
  document.getElementById('imgViewer').style.display = 'none';
  document.body.style.overflow = '';
  document.onkeydown = null;
}

function lbMove(dir){
  if(lbImages.length <= 1) return;
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  lbRender();
}

function lbRender(){
  const img = document.getElementById('lbImg');
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = lbImages[lbIndex];
    img.onload = () => { img.style.opacity = '1'; };
  }, 100);

  // Counter
  document.getElementById('lbCounter').textContent =
    lbImages.length > 1 ? `${lbIndex+1} / ${lbImages.length}` : '';

  // Dots
  const dots = document.getElementById('lbDots');
  dots.innerHTML = lbImages.length > 1
    ? lbImages.map((_,i) => `<div style="width:${i===lbIndex?'20px':'8px'};height:8px;border-radius:4px;background:${i===lbIndex?'#fff':'rgba(255,255,255,.4)'};transition:all .2s"></div>`).join('')
    : '';

  // Prev/Next visibility
  document.getElementById('lbPrev').style.display = lbImages.length > 1 ? 'flex' : 'none';
  document.getElementById('lbNext').style.display = lbImages.length > 1 ? 'flex' : 'none';

  // Download button

function cardUrl(id){
  return window.location.href.split('#')[0] + '#' + id;
}


function renderDateFilters(){
  const bar=document.getElementById('dateFilterBar');if(!bar)return;
  const filters=[
    {id:'all',label:'Bármikor'},
    {id:'today',label:'Ma'},
    {id:'week',label:'Elmúlt hét'},
    {id:'range',label:'📅 Időszak'}
  ];
  bar.innerHTML=filters.map(f=>`<div class="chip ${activeDateFilter===f.id?'on':''}" onclick="setDateFilter('${f.id}')">${f.label}</div>`).join('');
}
function setDateFilter(f){
  activeDateFilter=f;
  const picker=document.getElementById('dateRangePicker');
  if(picker) picker.style.display=(f==='range')?'flex':'none';
  if(f!=='range'){dateFrom=null;dateTo=null;}
  renderList();
  renderDateFilters();
}
function passesDateFilter(h){
  if(activeDateFilter==='all')return true;
  // Compare using date strings only (YYYY-MM-DD) to avoid timezone issues
  const upStr=h.uploaded?h.uploaded.slice(0,10):'';
  const now=new Date();
  const todayStr=now.toISOString().slice(0,10);
  if(activeDateFilter==='today')return upStr===todayStr;
  if(activeDateFilter==='week'){
    const weekAgo=new Date(now-7*864e5).toISOString().slice(0,10);
    return upStr>=weekAgo;
  }
  if(activeDateFilter==='range'){
    if(dateFrom&&upStr<dateFrom)return false;
    if(dateTo&&upStr>dateTo)return false;
    return true;
  }
  return true;
}

function buildMultiMsg(){
  const items=[...selectedIds].map(id=>homeworks.find(h=>h.id===id)).filter(Boolean);
  items.sort((a,b)=>new Date(a.due||0)-new Date(b.due||0));
  let msg=`📚 Házi feladatok – ${CFG.CNAME} (${items.length} feladat)\n\n`;
  items.forEach(h=>{
    msg+=`📖 ${h.subject}`;
    if(h.due)msg+=` – ${fmtDate(h.due)}`;
    msg+=`\n✏️ ${h.desc}\n`;
    if(h.note)msg+=`📌 ${h.note}\n`;
    const imgs=h.images||[];
    if(imgs.length)msg+=`🖼️ ${imgs.length} fotó\n`;
    msg+=`🔗 ${cardUrl(h.id)}\n\n`;
  });
  msg+=`✅ Feltöltötte: ${[...new Set(items.map(h=>h.uploader))].join(', ')}`;
  return msg;
}
function sendSelected(){
  if(!selectedIds.size){showToast('⚠️ Jelölj ki legalább egy feladatot!');return;}
  sendToMessenger(buildMultiMsg());
}
function copySelected(){
  if(!selectedIds.size){showToast('⚠️ Jelölj ki legalább egy feladatot!');return;}
  const t=buildMultiMsg();
  navigator.clipboard.writeText(t).then(()=>showToast('✅ Másolva!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ Másolva!');
  });
}

let favSet = new Set(); // loaded from cloud on login

async function loadFavs(){
  try{
    const r = await sheetRequest({action:'loadFavs', userName:session.name});
    if(r.status==='ok'){
      favSet = new Set(r.data||[]);
      localStorage.setItem('hz_fav_cache_5a', JSON.stringify([...favSet]));
    }
  }catch(e){
    // fallback to local cache silently
    try{ favSet=new Set(JSON.parse(localStorage.getItem('hz_fav_cache_5a')||'[]')); }catch{}
  }
  renderList(); // re-render with fav data
}

function isFav(id){ return favSet.has(id); }

async function toggleFav(id,e){
  if(e)e.stopPropagation();
  const wasFav = favSet.has(id);
  if(wasFav){ favSet.delete(id); } else { favSet.add(id); }
  // Update cache immediately
  localStorage.setItem('hz_fav_cache_5a', JSON.stringify([...favSet]));
  // Update button
  const btn=document.getElementById('detFavBtn');
  if(btn)btn.textContent=favSet.has(id)?'❤️ Kedvenc (töröl)':'🤍 Kedvencekhez';
  renderList();
  // Sync to cloud
  try{
    await sheetRequest({
      action: wasFav ? 'removeFav' : 'addFav',
      userName: session.name,
      hwId: id
    });
  }catch(e){ console.warn('Fav sync failed:', e); }
}

async function removeFavFromCloud(hwId){
  try{ await sheetRequest({action:'removeFavHw', hwId}); }catch{}
}

function exportSelectedExcel(){
  if(!selectedIds.size){showToast("Jelolj ki feladatot!");return;}
  const items=[...selectedIds].map(id=>homeworks.find(h=>h.id===id)).filter(Boolean);
  items.sort((a,b)=>new Date(a.due||0)-new Date(b.due||0));
  let csv="Tantargy,Feladat,Hatarido,Megjegyzes,Feltoltotte,Feltoltve,Kepek\n";
  items.forEach(h=>{
    const row=[h.subject,h.desc,h.due||"",h.note||"",h.uploader,fmtDT(h.uploaded),(h.images||[]).length]
      .map(v=>'"'+String(v).replace(/"/g,'""')+'"');
    csv+=row.join(",")+String.fromCharCode(10);
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="hazik_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
  showToast("Exportalva!");
}


function addReqDate(ds){
  if(!ds)return;
  if(!reqDays.includes(ds))reqDays.push(ds);
  reqDays.sort();
  updateDayChips();
  updateReqPreview();
}

function addReqWeek(){
  // Add Mon-Fri of current week
  const now=new Date();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(now.getDay()||7)+1);
  for(let i=0;i<5;i++){
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    const ds=d.toISOString().split('T')[0];
    if(!reqDays.includes(ds))reqDays.push(ds);
  }
  reqDays.sort();
  updateDayChips();
  updateReqPreview();
}

function addReqDateToday(){
  const d=new Date();
  addReqDate(d.toISOString().split('T')[0]);
}

function addReqDateTomorrow(){
  const d=new Date();
  d.setDate(d.getDate()+1);
  addReqDate(d.toISOString().split('T')[0]);
}


function updateDayChips(){
  const chips=document.getElementById('reqDayChips');
  if(!chips)return;
  chips.innerHTML=reqDays.length
    ? reqDays.map(d=>{
        const label=new Date(d).toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});
        return '<div class="req-chip on" style="display:flex;align-items:center;gap:4px;cursor:default">'+label
          +'<span onclick="toggleReqDay(\"'+d+'\")" style="cursor:pointer;font-size:12px;margin-left:4px;opacity:.7">✕</span></div>';
      }).join('')
    : '<span style="font-size:13px;color:var(--ink2)">Válassz dátumot fentebb</span>';
}


function applyDateRange(){
  const f=document.getElementById('dateFrom')?document.getElementById('dateFrom').value:'';
  const t=document.getElementById('dateTo')?document.getElementById('dateTo').value:'';
  dateFrom=f||null;
  dateTo=t||null;
  console.log('applyDateRange called: from='+dateFrom+' to='+dateTo);
  if(!dateFrom&&!dateTo){setDateFilter('all');return;}
  activeDateFilter='range';
  renderList();
  renderDateFilters();
}
function clearDateRange(){
  dateFrom=null;dateTo=null;
  document.getElementById('dateFrom').value='';
  document.getElementById('dateTo').value='';
  setDateFilter('all');
}
