<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Házi Feladat – 5.a osztaly</title>
<style>
:root{--ink:#1a1d27;--ink2:#4b5063;--bg:#f7f8fc;--card:#fff;--line:#e4e7f0;--blue:#2f6de1;--blue-bg:#eef3fd;--green:#1a9e5c;--amber:#c47f00;--red:#d93025;--r:13px;--sh:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.hdr{background:var(--blue);color:#fff;padding:14px 16px 11px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(47,109,225,.3)}
.hdr h1{font-size:17px;font-weight:800;letter-spacing:-.2px}.hdr .sub{font-size:11px;opacity:.75;margin-top:1px}
.hdr-btn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:64px;z-index:99;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:11px 10px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.view{display:none;padding:14px 14px 96px}.view.on{display:block}
/* Search bar */
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:10px 13px;border:2px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.search-bar input:focus{outline:none;border-color:var(--blue)}
/* Chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer}
.card:active{outline:2px solid var(--blue)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.subj{font-weight:800;font-size:15px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ok{background:#d1fae5;color:var(--green)}.soon{background:#fef3c7;color:var(--amber)}.past{background:#fee2e2;color:var(--red)}.nodue{background:#f3f4f6;color:var(--ink2)}
.desc{font-size:14px;color:#374151;margin-top:6px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.tag{font-size:11px;background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:10px;font-weight:600}
.who{font-size:11px;color:var(--ink2);margin-left:auto}
.thumbs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.thumb-more{width:58px;height:58px;border-radius:8px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--blue);border:1px solid var(--line)}
/* FAB */
.fab{position:fixed;bottom:22px;right:18px;width:56px;height:56px;border-radius:50%;background:#e55a10;color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 18px rgba(229,90,16,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.fab:active{transform:scale(.93)}
/* Overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:300;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:16px 16px 44px;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}}
.handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:18px;font-weight:900;margin-bottom:14px}
/* Login */
.login-screen{display:none;position:fixed;inset:0;background:var(--blue);z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-screen.on{display:flex}
.login-box{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:400px}
.login-logo{font-size:52px;text-align:center;margin-bottom:8px}
.login-title{font-size:22px;font-weight:900;text-align:center;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--ink2);text-align:center;margin-bottom:22px;line-height:1.5}
/* Form */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--blue)}
.field textarea{resize:vertical;min-height:72px}
/* Image picker */
.pick-btns{display:flex;gap:9px;margin-bottom:10px}
.pick-btn{flex:1;padding:13px 8px;border-radius:11px;border:2px dashed var(--line);background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick-btn:active{border-color:var(--blue);color:var(--blue)}
.pick-btn .ico{font-size:24px}
.prev-grid{display:grid;grid-template-columns:repeat(auto-fill,78px);gap:8px;margin-top:2px}
.prev-wrap{position:relative}
.prev-wrap img{width:78px;height:78px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.prev-rm{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px;display:none}
.progress-fill{height:100%;background:var(--blue);width:0;transition:width .3s}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:800;border:none;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-danger{background:var(--red);color:#fff}.btn-full{width:100%}.btn-row{display:flex;gap:9px;margin-top:12px}
/* Messenger */
.msg-box{background:#f0f2f5;border-radius:11px;padding:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#1c1e21;margin-bottom:12px;border:1px solid #dde0e4}
.fb-copy{width:100%;padding:13px;background:#1877f2;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:9px;display:flex;align-items:center;justify-content:center;gap:8px}
/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:11px}
.gallery-wrap{position:relative;display:block}
.gallery-wrap img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;cursor:pointer;display:block;background:var(--bg)}
.gallery-rm{position:absolute;top:4px;right:4px;background:rgba(220,48,37,.85);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* Trash */
.trash-card{background:#fff8f8;border-radius:var(--r);padding:13px 14px;margin-bottom:9px;border:1px solid #fecaca;box-shadow:var(--sh)}
.trash-meta{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.7}
.tbtn{flex:1;padding:10px 8px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid}
.tbtn-restore{background:#f0fdf4;border-color:var(--green);color:var(--green)}
.tbtn-perm{background:#fff5f5;border-color:var(--red);color:var(--red)}
/* Toast */
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(14px);background:#111827;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:600;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:17px;height:17px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}.empty .ico{font-size:42px;margin-bottom:10px}
.sec-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin-bottom:9px}
.detail-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.info-row{font-size:12px;color:var(--ink2);margin-bottom:6px}
.upload-status{font-size:13px;color:var(--ink2);margin-top:6px;min-height:18px}
.existing-imgs{margin-bottom:8px}
.existing-imgs label{display:block;font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
/* Export btn */
.export-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border:2px solid var(--line);border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;margin-bottom:12px}
.export-btn:active{border-color:var(--blue);color:var(--blue)}
.req-section{margin-bottom:16px}
.req-section h3{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.req-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.req-chip{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s}
.req-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.req-preview{background:#f0f2f5;border-radius:11px;padding:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#1c1e21;margin-bottom:12px;border:1px solid #dde0e4;min-height:80px}
.export-btn:active{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>

<div class="login-screen on" id="loginScreen">
  <div class="login-box">

<script>
const CFG = {
  CNAME:         '5.a osztaly',
  PIN:           '2026',
  SHEET_ID:      '1KopuaNCn1nUn8JHDBYEjEqKp3EXaLErX8qvkeOu8ndk',
  SCRIPT_URL:    'https://script.google.com/macros/s/AKfycbzrBagJKW3rxFX5XiSmLQ7XLItU9WsODMFtNx5JeUnxt8eVWPc4-4w8neMGmJPM34IG/exec',
  CLOUD_NAME:    'g8tinasd',
  UPLOAD_PRESET: 'szekai_hazik',
  CLOUD_FOLDER:  'hazik_5a',
};

let session = null;
let homeworks = [];
let pendingImgs = [];
let removedImgs = [];
let keepImgs = [];
let activeFilter = 'all';
let activeFilterAll = 'all';
let editingId = null;
let trashItems = [];

// ── Helpers ──────────────────────────────────────────
function slugify(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_').toLowerCase();}
function safeJSON(s){
  if(!s||s==='[]'||s==='""'||s==='')return[];
  // Clean up if wrapped in extra quotes
  let str = String(s).trim();
  if(str.startsWith('"['))str=str.slice(1,-1);
  try{const r=JSON.parse(str);return Array.isArray(r)?r:[];}catch{return[];}
}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dueInfo(ds){
  if(!ds||ds==='')return{text:'Nincs határidő',cls:'nodue'};
  const d=new Date(ds);if(isNaN(d))return{text:'?',cls:'nodue'};
  d.setHours(0,0,0,0);
  const diff=Math.round((d-today0())/864e5);
  if(diff<0)return{text:'Lejárt',cls:'past'};
  if(diff===0)return{text:'Ma!',cls:'soon'};
  if(diff===1)return{text:'Holnap',cls:'soon'};
  if(diff<=3)return{text:diff+' nap',cls:'soon'};
  return{text:fmtDate(ds),cls:'ok'};
}
function fmtDate(s){if(!s)return'–';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleDateString('hu-HU',{month:'short',day:'numeric',weekday:'short'});}
function fmtDT(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleString('hu-HU',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
let _tt;
function showToast(msg,dur=2700){clearTimeout(_tt);const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');if(dur<99999)_tt=setTimeout(()=>t.classList.remove('on'),dur);}
function hideToast(){document.getElementById('toast').classList.remove('on');}
function openSheet(id){document.getElementById(id).classList.add('on');}
function closeSheet(id){document.getElementById(id).classList.remove('on');}

// ── Init ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('loginBtn').onclick=signIn;
  document.getElementById('pinCode').addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});
  document.getElementById('logoutBtn').onclick=logout;
  document.getElementById('fabBtn').onclick=()=>openAddSheet(null);
  document.getElementById('cancelAddBtn').onclick=()=>closeSheet('addSheet');
  document.getElementById('saveBtn').onclick=saveHW;
  document.getElementById('camBtn').onclick=()=>document.getElementById('camInput').click();
  document.getElementById('galleryBtn').onclick=()=>document.getElementById('galleryInput').click();
  document.getElementById('camInput').onchange=handleImgs;
  document.getElementById('galleryInput').onchange=handleImgs;
  document.getElementById('copyBtn').onclick=copyNotify;
  document.getElementById('messengerBtn').onclick=()=>sendToMessenger(document.getElementById('notifyText').textContent);
  document.getElementById('closeNotifyBtn').onclick=()=>closeSheet('notifySheet');
  document.getElementById('imgViewer').onclick=()=>closeSheet('imgViewer');
  document.getElementById('addSheet').onclick=e=>{if(e.target===document.getElementById('addSheet'))closeSheet('addSheet');};
  document.getElementById('detailSheet').onclick=e=>{if(e.target===document.getElementById('detailSheet'))closeSheet('detailSheet');};
  document.getElementById('notifySheet').onclick=e=>{if(e.target===document.getElementById('notifySheet'))closeSheet('notifySheet');};
  ['list','all','notify','request','trash'].forEach(name=>{
    document.getElementById('tab-'+name).onclick=()=>{switchTab(name);if(name==='trash')loadTrash();if(name==='request')renderRequestTab();renderAll();};
  });
  const s=localStorage.getItem('hz_s_5a');
  if(s){session=JSON.parse(s);showApp();}
});

// ── Auth ─────────────────────────────────────────────
function signIn(){
  const name=document.getElementById('pinName').value.trim();
  const pin=document.getElementById('pinCode').value.trim();
  const err=document.getElementById('loginErr');
  if(!name){err.textContent='Add meg a neved!';err.style.display='block';return;}
  if(pin!==CFG.PIN){err.textContent='Hibás PIN-kód!';err.style.display='block';return;}
  session={name};
  localStorage.setItem('hz_s_5a',JSON.stringify(session));
  err.style.display='none';showApp();
}
function showApp(){
  document.getElementById('loginScreen').classList.remove('on');
  document.getElementById('hdrName').textContent=session.name;
  loadSheet();
}
function logout(){
  if(!confirm('Kijelentkezel?'))return;
  session=null;localStorage.removeItem('hz_s_5a');homeworks=[];
  document.getElementById('loginScreen').classList.add('on');
  document.getElementById('pinCode').value='';
}

// ── JSONP request ─────────────────────────────────────
async function sheetRequest(params){
  return new Promise((resolve,reject)=>{
    const cbName='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const base=CFG.SCRIPT_URL+'?sheetId='+encodeURIComponent(CFG.SHEET_ID)+'&callback='+cbName;
    const qs=Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v)).join('&');
    const url=base+'&'+qs+'&t='+Date.now();
    window[cbName]=(data)=>{
      delete window[cbName];document.head.removeChild(script);
      if(data.version)document.getElementById('appVersion').textContent='v'+data.version+' · OK';
      resolve(data);
    };
    const script=document.createElement('script');
    script.src=url;
    script.onerror=()=>{delete window[cbName];try{document.head.removeChild(script);}catch(e){}reject(new Error('Script hiba'));};
    setTimeout(()=>{if(window[cbName]){delete window[cbName];try{document.head.removeChild(script);}catch(e){}reject(new Error('Timeout'));}},15000);
    document.head.appendChild(script);
  });
}

// ── Sheets ───────────────────────────────────────────
async function loadSheet(){
  showToast('⏳ Betöltés…',99999);
  try{
    const url=`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=Feladatok&t=${Date.now()}`;
    const r=await fetch(url);
    const text=await r.text();
    // Google returns: /*O_o*/\ngoogle.visualization.Query.setResponse({...});
    const json=JSON.parse(text.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    homeworks=parseGViz(json);
    localStorage.setItem('hz_hw_5a',JSON.stringify(homeworks));
  }catch(e){
    console.warn('GViz load failed:',e);
    homeworks=JSON.parse(localStorage.getItem('hz_hw_5a')||'[]');
    showToast('⚠️ Offline – helyi adatok');
  }
  hideToast();renderAll();
}

function parseGViz(json){
  try{
    const rows=json.table.rows;
    return rows.map(row=>{
      const get=(i)=>{
        const c=row.c&&row.c[i];
        if(!c||c.v==null)return '';
        // GViz returns dates as "Date(2026,9,11)" - convert to YYYY-MM-DD
        const v=String(c.v);
        const dm=v.match(/^Date\((\d+),(\d+),(\d+)\)$/);
        if(dm){
          const y=dm[1],m=String(+dm[2]+1).padStart(2,'0'),d=String(dm[3]).padStart(2,'0');
          return y+'-'+m+'-'+d;
        }
        return v;
      };
      const images=safeJSON(get(7));
      return{
        id:get(0),subject:get(1),desc:get(2),due:get(3),
        note:get(4),uploader:get(5),uploaded:get(6),
        images:images,cloudFolder:get(8)||''
      };
    }).filter(h=>h.id&&h.id!=='id');
  }catch(e){console.error('parseGViz error:',e);return[];}
}

// ── Cloudinary ───────────────────────────────────────
async function uploadToCloudinary(file,subject,dateStr){
  const folder=`${CFG.CLOUD_FOLDER}/${slugify(subject)}${dateStr?'_'+dateStr:''}`;
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CFG.UPLOAD_PRESET);
  fd.append('folder',folder);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||r.status);}
  const j=await r.json();
  return{url:j.secure_url,publicId:j.public_id,folder};
}

// ── Images ───────────────────────────────────────────
function handleImgs(e){
  Array.from(e.target.files).forEach(f=>{
    const fr=new FileReader();
    fr.onload=ev=>{pendingImgs.push({file:f,dataUrl:ev.target.result});renderNewPreviews();};
    fr.readAsDataURL(f);
  });
  e.target.value='';
}
function renderNewPreviews(){
  document.getElementById('prevGrid').innerHTML=pendingImgs.map((img,i)=>
    `<div class="prev-wrap"><img src="${img.dataUrl}"><button class="prev-rm" data-i="${i}">×</button></div>`
  ).join('');
  document.getElementById('prevGrid').querySelectorAll('.prev-rm').forEach(btn=>{
    btn.onclick=()=>{pendingImgs.splice(+btn.dataset.i,1);renderNewPreviews();};
  });
  document.getElementById('uploadStatus').textContent=pendingImgs.length?`${pendingImgs.length} új kép`:'';
}
function renderExistingPreviews(){
  const el=document.getElementById('existingGrid');
  const wrap=document.getElementById('existingImgs');
  if(!keepImgs.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  el.innerHTML=keepImgs.map((url,i)=>
    `<div class="prev-wrap"><img src="${url}"><button class="prev-rm" data-i="${i}">×</button></div>`
  ).join('');
  el.querySelectorAll('.prev-rm').forEach(btn=>{
    btn.onclick=()=>{removedImgs.push(keepImgs[+btn.dataset.i]);keepImgs.splice(+btn.dataset.i,1);renderExistingPreviews();};
  });
}

// ── Save ─────────────────────────────────────────────
async function saveHW(){
  const subject=document.getElementById('newSubject').value;
  const desc=document.getElementById('newDesc').value.trim();
  const due=document.getElementById('newDue').value;
  const note=document.getElementById('newNote').value.trim();
  if(!desc){showToast('⚠️ Írd le a feladatot!');return;}
  const btn=document.getElementById('saveBtn');
  btn.innerHTML='<span class="spin"></span> Mentés…';btn.disabled=true;
  const pw=document.getElementById('progressWrap');const pf=document.getElementById('progressFill');
  pw.style.display='block';pf.style.width='0%';
  const newUrls=[];let cloudFolder='';
  for(let i=0;i<pendingImgs.length;i++){
    try{
      document.getElementById('uploadStatus').textContent=`Kép feltöltése ${i+1}/${pendingImgs.length}…`;
      pf.style.width=`${Math.round((i/pendingImgs.length)*80)}%`;
      const res=await uploadToCloudinary(pendingImgs[i].file,subject,due);
      newUrls.push(res.url);
      cloudFolder=`https://console.cloudinary.com/console/media_library/search?q=folder:${encodeURIComponent(res.folder)}`;
    }catch(e){showToast('⚠️ Kép hiba: '+e.message);}
  }
  pf.style.width='90%';
  const allImages=[...keepImgs,...newUrls];
  if(editingId){
    const hw=homeworks.find(h=>h.id===editingId);
    hw.subject=subject;hw.desc=desc;hw.due=due;hw.note=note;hw.images=allImages;
    if(cloudFolder)hw.cloudFolder=cloudFolder;
    try{
      await sheetRequest({action:'update',id:editingId,row:JSON.stringify([hw.id,hw.subject,hw.desc,hw.due,hw.note,hw.uploader,hw.uploaded,JSON.stringify(hw.images),hw.cloudFolder||''])});
      showToast('✅ Frissítve!');
    }catch{showToast('✅ Helyben frissítve');}
  }else{
    const hw={id:Date.now().toString(),subject,desc,due,note,uploader:session.name,uploaded:new Date().toISOString(),images:allImages,cloudFolder};
    homeworks.push(hw);
    try{
      await sheetRequest({action:'append',row:JSON.stringify([hw.id,hw.subject,hw.desc,hw.due,hw.note,hw.uploader,hw.uploaded,JSON.stringify(hw.images),hw.cloudFolder||''])});
      showToast('✅ Feltöltve!');
    }catch{showToast('✅ Helyben mentve');}
  }
  localStorage.setItem('hz_hw_5a',JSON.stringify(homeworks));
  pf.style.width='100%';
  pendingImgs=[];keepImgs=[];removedImgs=[];
  renderNewPreviews();pw.style.display='none';
  document.getElementById('uploadStatus').textContent='';
  btn.innerHTML='Mentés ✓';btn.disabled=false;
  closeSheet('addSheet');renderAll();
}

// ── Delete ────────────────────────────────────────────
async function deleteHW(id){
  if(!confirm('Biztosan törlöd? Kukából visszaállítható.'))return;
  homeworks=homeworks.filter(h=>h.id!==id);
  localStorage.setItem('hz_hw_5a',JSON.stringify(homeworks));
  try{await sheetRequest({action:'delete',id:id,deletedBy:session.name});showToast('🗑️ Törölve – Kukában van');}
  catch{showToast('🗑️ Helyben törölve');}
  closeSheet('detailSheet');renderAll();loadTrash();
}
async function deleteImageFromHW(hwId,url){
  if(!confirm('Törlöd ezt a képet?'))return;
  const h=homeworks.find(x=>x.id===hwId);if(!h)return;
  h.images=h.images.filter(u=>u!==url);
  localStorage.setItem('hz_hw_5a',JSON.stringify(homeworks));
  try{await sheetRequest({action:'update',id:hwId,row:JSON.stringify([h.id,h.subject,h.desc,h.due,h.note,h.uploader,h.uploaded,JSON.stringify(h.images),h.cloudFolder||''])});showToast('🗑️ Kép törölve');}
  catch{showToast('🗑️ Helyben törölve');}
  closeSheet('detailSheet');openDetail(hwId);
}

// ── Trash ─────────────────────────────────────────────
async function loadTrash(){
  try{const r=await sheetRequest({action:'loadTrash'});trashItems=r.data||[];}
  catch{trashItems=[];}
  renderTrash();
}
function renderTrash(){
  const el=document.getElementById('trashList');
  if(!trashItems.length){el.innerHTML='<div class="empty"><div class="ico">🗑️</div><p>A Kuka üres.</p></div>';return;}
  el.innerHTML='<div class="sec-label">Törölt feladatok – visszaállíthatók</div>'+
    trashItems.map(h=>`<div class="trash-card">
      <div class="card-head"><div class="subj">${h.subject}</div><div class="badge past">Törölve</div></div>
      <div class="desc">${h.desc}</div>
      <div class="trash-meta">📅 ${fmtDate(h.due)}<br>⬆️ ${h.uploader}<br>🗑️ <b>${h.deletedBy}</b> · ${fmtDT(h.deletedAt)}
      ${safeJSON(h.images).length?`<br>🖼️ ${safeJSON(h.images).length} kép`:''}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="tbtn tbtn-restore" onclick="restoreHW('${h.id}')">↩️ Visszaállítás</button>
        <button class="tbtn tbtn-perm" onclick="permDeleteHW('${h.id}')">🗑️ Végleges törlés</button>
      </div></div>`).join('');
}
async function restoreHW(id){
  if(!confirm('Visszaállítod?'))return;
  showToast('⏳ Visszaállítás…',99999);
  try{await sheetRequest({action:'restore',id:id});await loadSheet();await loadTrash();hideToast();showToast('✅ Visszaállítva!');}
  catch{hideToast();showToast('⚠️ Hiba a visszaállításnál.');}
}
async function permDeleteHW(id){
  if(!confirm('Véglegesen törlöd?'))return;
  try{await sheetRequest({action:'permDelete',id:id});await loadTrash();showToast('🗑️ Véglegesen törölve.');}
  catch{showToast('⚠️ Hiba.');}
}

// ── Export Excel ──────────────────────────────────────
function exportExcel(mode){
  const items = mode==='active' ? activeHW() : homeworks;
  let csv = 'Tantárgy,Feladat,Határidő,Megjegyzés,Feltöltötte,Feltöltve,Képek száma\n';
  items.forEach(h=>{
    const row=[
      h.subject, h.desc, h.due||'', h.note||'', h.uploader,
      fmtDT(h.uploaded), (h.images||[]).length
    ].map(v=>'"'+String(v).replace(/"/g,'""')+'"');
    csv+=row.join(',')+'\n';
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`hazik_${CFG.CNAME.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('📥 Exportálva!');
}

// ── Render ────────────────────────────────────────────
function renderAll(){renderFilters();renderList();renderAll2();renderNotifyList();}

function renderFilters(){
  const subs=[...new Set(homeworks.map(h=>h.subject))];
  ['filterBar','filterBarAll'].forEach((barId,idx)=>{
    const bar=document.getElementById(barId);
    bar.innerHTML='';
    const all=document.createElement('div');
    all.className='chip on';all.textContent='Összes';
    all.onclick=()=>{if(idx===0){activeFilter='all';}else{activeFilterAll='all';}renderAll();};
    bar.appendChild(all);
    subs.forEach(s=>{
      const c=document.createElement('div');
      c.className='chip';c.textContent=s;
      c.onclick=()=>{if(idx===0){activeFilter=s;}else{activeFilterAll=s;}renderAll();};
      bar.appendChild(c);
    });
  });
  document.querySelectorAll('#filterBar .chip').forEach(c=>c.classList.toggle('on',c.textContent===(activeFilter==='all'?'Összes':activeFilter)));
  document.querySelectorAll('#filterBarAll .chip').forEach(c=>c.classList.toggle('on',c.textContent===(activeFilterAll==='all'?'Összes':activeFilterAll)));
}

function activeHW(){return homeworks.filter(h=>{if(!h.due)return true;const d=new Date(h.due);d.setHours(0,0,0,0);return d>=today0();});}

function filterSearch(items, searchId){
  const q=document.getElementById(searchId)?.value?.toLowerCase()||'';
  if(!q)return items;
  return items.filter(h=>h.subject.toLowerCase().includes(q)||h.desc.toLowerCase().includes(q)||(h.note||'').toLowerCase().includes(q)||(h.uploader||'').toLowerCase().includes(q));
}

function cardHTML(h){
  const{text,cls}=dueInfo(h.due);
  const imgs=Array.isArray(h.images)?h.images.slice(0,3):[];
  const extra=Array.isArray(h.images)?h.images.length-3:0;
  return`<div class="card" data-id="${h.id}">
    <div class="card-head"><div class="subj">${h.subject}</div><div class="badge ${cls}">${text}</div></div>
    <div class="desc">${h.desc}</div>
    ${imgs.length?`<div class="thumbs">${imgs.map(u=>`<img class="thumb" src="${u}" loading="lazy" onerror="this.style.display='none'">`).join('')}${extra>0?`<div class="thumb-more">+${extra}</div>`:''}</div>`:''}
    <div class="meta">
      ${h.note?`<span class="tag">📌 ${h.note}</span>`:''}
      ${imgs.length?`<span class="tag">🖼️ ${h.images.length}</span>`:''}
      <span class="who">⬆️ ${h.uploader} · ${fmtDT(h.uploaded)}</span>
    </div>
  </div>`;
}

function attachClicks(containerId){
  document.getElementById(containerId).querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

function renderList(){
  let items=activeHW();
  if(activeFilter!=='all')items=items.filter(h=>h.subject===activeFilter);
  items=filterSearch(items,'searchList');
  items.sort((a,b)=>{if(!a.due)return 1;if(!b.due)return -1;return new Date(a.due)-new Date(b.due);});
  const el=document.getElementById('hwList');
  el.innerHTML=items.length?items.map(cardHTML).join(''):`<div class="empty"><div class="ico">🎉</div><p>Nincs aktív házi feladat!</p></div>`;
  attachClicks('hwList');
  document.getElementById('tab-list').textContent='📋 Feladatok'+(items.length?' ('+items.length+')':'');
}

function renderAll2(){
  let items=[...homeworks];
  if(activeFilterAll!=='all')items=items.filter(h=>h.subject===activeFilterAll);
  items=filterSearch(items,'searchAll');
  items.sort((a,b)=>{if(!a.due)return 1;if(!b.due)return -1;return new Date(b.due)-new Date(a.due);});
  const el=document.getElementById('hwListAll');
  el.innerHTML=items.length?items.map(cardHTML).join(''):`<div class="empty"><div class="ico">📦</div><p>Nincs feladat.</p></div>`;
  attachClicks('hwListAll');
  document.getElementById('tab-all').textContent='📦 Összes'+(items.length?' ('+items.length+')':'');
}

function renderNotifyList(){
  const items=activeHW().sort((a,b)=>{if(!a.due)return 1;if(!b.due)return -1;return new Date(a.due)-new Date(b.due);});
  const el=document.getElementById('notifyList');
  el.innerHTML=items.length?items.map(h=>{const{text,cls}=dueInfo(h.due);return`<div class="card" data-id="${h.id}">
    <div class="card-head"><div class="subj">${h.subject}</div><div class="badge ${cls}">${text}</div></div>
    <div class="desc">${h.desc}</div>
    <div style="margin-top:8px;font-size:13px;color:var(--blue);font-weight:700;">💬 Értesítő generálása →</div>
  </div>`;}).join(''):`<div class="empty"><div class="ico">💬</div><p>Nincs aktív feladat.</p></div>`;
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>openNotify(c.dataset.id));
}

// ── Detail ────────────────────────────────────────────
function openDetail(id){
  const h=homeworks.find(x=>x.id===id);if(!h)return;
  const{text,cls}=dueInfo(h.due);
  const imgs=Array.isArray(h.images)?h.images:[];
  document.getElementById('detailContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px">
      <div style="font-size:20px;font-weight:900">${h.subject}</div>
      <div class="badge ${cls}" style="font-size:13px">${text}</div>
    </div>
    <div style="font-size:15px;line-height:1.6;margin-bottom:7px">${h.desc}</div>
    ${h.note?`<div class="info-row">📌 ${h.note}</div>`:''}
    <div class="info-row">⬆️ <b>${h.uploader}</b> · ${fmtDT(h.uploaded)}</div>
    ${imgs.length?`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:11px;margin-bottom:6px">
        <span style="font-size:12px;font-weight:700;color:var(--ink2)">${imgs.length} kép</span>
        <button id="dlAllBtn" style="background:var(--blue-bg);border:none;color:var(--blue);font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer">⬇️ Összes letöltése</button>
      </div>
      <div class="gallery">${imgs.map((u,i)=>`<div class="gallery-wrap">
        <img src="${u}" loading="lazy" onerror="this.style.opacity='.3'" data-url="${u}">
        <button class="gallery-rm" data-url="${u}">×</button>
        <button class="dl-btn" data-url="${u}" data-idx="${i+1}" style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:6px;padding:3px 6px;font-size:11px;cursor:pointer">⬇️</button>
      </div>`).join('')}</div>`:''}
    <div class="detail-actions">
      <button class="btn btn-primary btn-full" id="detNotifyBtn">💬 Értesítő generálása</button>
      <button class="btn btn-secondary btn-full" id="detRequestBtn">🙋 Feltöltést kér üzenet</button>
      <button class="btn btn-secondary btn-full" id="detEditBtn">✏️ Szerkesztés</button>
      <button class="btn btn-danger btn-full" id="detDeleteBtn">🗑️ Törlés</button>
    </div>`;
  document.querySelectorAll('.gallery-wrap img').forEach(img=>img.onclick=()=>{document.getElementById('viewerImg').src=img.dataset.url;openSheet('imgViewer');});
  document.querySelectorAll('.gallery-rm').forEach(btn=>btn.onclick=e=>{e.stopPropagation();deleteImageFromHW(id,btn.dataset.url);});
  document.querySelectorAll('.dl-btn').forEach(btn=>btn.onclick=e=>{e.stopPropagation();downloadImg(btn.dataset.url,+btn.dataset.idx);});
  const dlAll=document.getElementById('dlAllBtn');
  if(dlAll)dlAll.onclick=()=>downloadAll(imgs);
  document.getElementById('detNotifyBtn').onclick=()=>{openNotify(id);closeSheet('detailSheet');};
  document.getElementById('detRequestBtn').onclick=()=>openRequestNotify(id);
  document.getElementById('detEditBtn').onclick=()=>{closeSheet('detailSheet');openAddSheet(id);};
  document.getElementById('detDeleteBtn').onclick=()=>deleteHW(id);
  openSheet('detailSheet');
}

// ── Add/Edit ──────────────────────────────────────────
function openAddSheet(id){
  editingId=id;pendingImgs=[];keepImgs=[];removedImgs=[];
  renderNewPreviews();
  document.getElementById('progressWrap').style.display='none';
  document.getElementById('uploadStatus').textContent='';
  if(id){
    const h=homeworks.find(x=>x.id===id);
    document.getElementById('addSheetTitle').textContent='Szerkesztés';
    document.getElementById('newSubject').value=h.subject;
    document.getElementById('newDesc').value=h.desc;
    document.getElementById('newDue').value=h.due||'';
    document.getElementById('newNote').value=h.note||'';
    keepImgs=[...(Array.isArray(h.images)?h.images:[])];
    renderExistingPreviews();
  }else{
    document.getElementById('addSheetTitle').textContent='Új házi feladat';
    document.getElementById('newDesc').value='';
    document.getElementById('newNote').value='';
    document.getElementById('newDue').value='';
    document.getElementById('existingImgs').style.display='none';
  }
  openSheet('addSheet');
}

// ── Notify ────────────────────────────────────────────
function openNotify(id){
  const h=homeworks.find(x=>x.id===id);if(!h)return;
  let msg=`📚 Házi feladat – ${CFG.CNAME}\n\n`;
  msg+=`📖 Tantárgy: ${h.subject}\n`;
  msg+=`✏️ Feladat: ${h.desc}\n`;
  if(h.due)msg+=`📅 Határidő: ${fmtDate(h.due)}\n`;
  if(h.note)msg+=`📌 Megjegyzés: ${h.note}\n`;
  const imgs=h.images||[];
  if(imgs.length===1){
    msg+=`\n🖼️ Kép:\n${imgs[0]}\n`;
  } else if(imgs.length>1){
    msg+=`\n🖼️ Képek (${imgs.length} db):\n`;
    imgs.forEach((u,i)=>msg+=`${i+1}. ${u}\n`);
  }
  msg+=`\n✅ Feltöltötte: ${h.uploader}`;
  document.getElementById('notifyText').textContent=msg;
  openSheet('notifySheet');
}
function openRequestNotify(id){
  const h=homeworks.find(x=>x.id===id);if(!h)return;
  let msg=`🙏 Sziasztok!\n\nMég nem tudjuk a ${h.subject} házi feladatot${h.due?' ('+fmtDate(h.due)+')':''}.\n\nValaki fel tudná tölteni? Köszönöm! 🙂`;
  document.getElementById('notifyText').textContent=msg;
  closeSheet('detailSheet');openSheet('notifySheet');
}
function copyNotify(){
  const t=document.getElementById('notifyText').textContent;
  navigator.clipboard.writeText(t).then(()=>showToast('✅ Másolva!')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ Másolva!');});
}

// ── Tab switch ────────────────────────────────────────
function switchTab(name){
  ['list','all','notify','request','trash'].forEach(n=>{
    document.getElementById('tab-'+n).classList.toggle('on',n===name);
    document.getElementById('view-'+n).classList.toggle('on',n===name);
  });
}

// ── Download images ───────────────────────────────────
async function downloadImg(url, idx){
  try{
    showToast('⏳ Letöltés…', 99999);
    const r = await fetch(url);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hazi_kep_${idx}.jpg`;
    a.click();
    hideToast();
    showToast('✅ Letöltve!');
  }catch(e){
    hideToast();
    // Fallback: open in new tab
    window.open(url, '_blank');
  }
}

async function downloadAll(imgs){
  if(!imgs||!imgs.length)return;
  showToast('⏳ Letöltés folyamatban…', 99999);
  for(let i=0;i<imgs.length;i++){
    await downloadImg(imgs[i], i+1);
    if(i<imgs.length-1) await new Promise(r=>setTimeout(r,800));
  }
  hideToast();
  showToast('✅ Összes letöltve!');
}

// ── Request tab ───────────────────────────────────────
let reqDays = [];    // selected day strings YYYY-MM-DD
let reqSubjects = []; // selected subjects
let reqMode = 'day'; // 'day' | 'week' | 'subjects' | 'all'

function renderRequestTab(){
  const el = document.getElementById('requestContent');

  // Build week days (Mon-Fri from today)
  const days = [];
  const now = new Date();
  // Show next 7 days
  for(let i=0;i<7;i++){
    const d = new Date(now);
    d.setDate(now.getDate()+i);
    const dow = d.getDay();
    if(dow===0||dow===6) continue; // skip weekends
    days.push(d);
    if(days.length>=5) break;
  }

  const allSubjects = [...new Set(homeworks.map(h=>h.subject))];
  // Use CFG subjects from select options
  const selectEl = document.getElementById('newSubject');
  const cfgSubjects = selectEl ? Array.from(selectEl.options).map(o=>o.value) : allSubjects;

  el.innerHTML = `
    <div style="margin-bottom:16px">
      <h3 style="font-size:16px;font-weight:900;margin-bottom:4px">🙋 Feltöltést kérő üzenet</h3>
      <p style="font-size:13px;color:var(--ink2)">Állítsd össze mire kérsz házi feladatot, majd másold be Messengerbe.</p>
    </div>

    <div class="req-section">
      <h3>Mire kérj?</h3>
      <div class="req-chips">
        <div class="req-chip ${reqMode==='day'?'on':''}" onclick="setReqMode('day')">📅 Egy napra</div>
        <div class="req-chip ${reqMode==='week'?'on':''}" onclick="setReqMode('week')">📆 Egész hétre</div>
        <div class="req-chip ${reqMode==='subjects'?'on':''}" onclick="setReqMode('subjects')">📖 Tantárgyra</div>
        <div class="req-chip ${reqMode==='all'?'on':''}" onclick="setReqMode('all')">📚 Mindenre</div>
      </div>
    </div>

    <div class="req-section" id="reqDaySection" style="${reqMode==='day'?'':'display:none'}">
      <h3>Melyik napra?</h3>
      <div class="req-chips" id="reqDayChips">
        ${days.map(d=>{
          const ds=d.toISOString().split('T')[0];
          const label=d.toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});
          return `<div class="req-chip ${reqDays.includes(ds)?'on':''}" onclick="toggleReqDay('${ds}')" data-ds="${ds}">${label}</div>`;
        }).join('')}
      </div>
    </div>

    <div class="req-section" id="reqSubjSection" style="${reqMode==='subjects'?'':'display:none'}">
      <h3>Melyik tantárgy(ak)?</h3>
      <div class="req-chips" id="reqSubjChips">
        ${cfgSubjects.map(s=>`<div class="req-chip ${reqSubjects.includes(s)?'on':''}" onclick="toggleReqSubj('${s.replace(/'/g,"\'")}')">${s}</div>`).join('')}
      </div>
    </div>

    <div class="req-section">
      <h3>Előnézet</h3>
      <div class="req-preview" id="reqPreview">${buildRequestMsg()}</div>
      <button class="fb-copy" onclick="copyRequestMsg()">📋 Másolás vágólapra</button>
      <button class="fb-copy" onclick="sendToMessenger(buildRequestMsg())" style="background:#0084ff;margin-top:8px">💬 Megnyitás Messengerben</button>
    </div>
  `;
}

function setReqMode(mode){
  reqMode=mode;
  if(mode!=='day') reqDays=[];
  if(mode!=='subjects') reqSubjects=[];
  renderRequestTab();
  updateReqPreview();
}

function toggleReqDay(ds){
  const i=reqDays.indexOf(ds);
  if(i>=0) reqDays.splice(i,1); else reqDays.push(ds);
  // Update chip
  document.querySelectorAll('#reqDayChips .req-chip').forEach(c=>{
    if(c.dataset.ds===ds) c.classList.toggle('on', reqDays.includes(ds));
  });
  updateReqPreview();
}

function toggleReqSubj(s){
  const i=reqSubjects.indexOf(s);
  if(i>=0) reqSubjects.splice(i,1); else reqSubjects.push(s);
  document.querySelectorAll('#reqSubjChips .req-chip').forEach(c=>{
    if(c.textContent===s) c.classList.toggle('on', reqSubjects.includes(s));
  });
  updateReqPreview();
}

function updateReqPreview(){
  const el=document.getElementById('reqPreview');
  if(el) el.textContent=buildRequestMsg();
}

function buildRequestMsg(){
  let msg=`🙏 Sziasztok!\n\n`;
  if(reqMode==='all'){
    msg+=`Kérném, hogy aki tudja a házi feladatokat, töltse fel az appba!\n`;
  } else if(reqMode==='week'){
    const now=new Date();
    const mon=new Date(now);
    mon.setDate(now.getDate()-(now.getDay()||7)+1);
    const fri=new Date(mon);fri.setDate(mon.getDate()+4);
    const fmt=d=>d.toLocaleDateString('hu-HU',{month:'short',day:'numeric'});
    msg+=`Kérném a heti (${fmt(mon)}–${fmt(fri)}) házi feladatokat, aki tudja töltse fel az appba!\n`;
  } else if(reqMode==='day'){
    if(!reqDays.length){
      msg+=`Kérném a házi feladatokat, aki tudja töltse fel az appba!\n`;
    } else {
      const labels=reqDays.map(ds=>new Date(ds).toLocaleDateString('hu-HU',{weekday:'long',month:'long',day:'numeric'}));
      msg+=`Kérném a következő napra szóló házi feladatokat:\n`;
      labels.forEach(l=>msg+=`📅 ${l}\n`);
      msg+=`\nAki tudja, töltse fel az appba!\n`;
    }
  } else if(reqMode==='subjects'){
    if(!reqSubjects.length){
      msg+=`Kérném a házi feladatokat, aki tudja töltse fel az appba!\n`;
    } else if(reqSubjects.length===1){
      msg+=`Kérném a(z) ${reqSubjects[0]} házi feladatot, aki tudja töltse fel az appba!\n`;
    } else {
      msg+=`Kérném az alábbi tantárgyak házi feladatait:\n`;
      reqSubjects.forEach(s=>msg+=`📖 ${s}\n`);
      msg+=`\nAki tudja, töltse fel az appba!\n`;
    }
  }
  msg+=`\nKöszönöm! 🙂`;
  return msg;
}

function copyRequestMsg(){
  const t=buildRequestMsg();
  navigator.clipboard.writeText(t).then(()=>showToast('✅ Másolva! Illeszd be Messengerbe.')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ Másolva!');
  });
}


function sendToMessenger(text){
  // Copy to clipboard first
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
  // Try Messenger app deep link (mobile)
  const encoded = encodeURIComponent(text);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  if(isIOS){
    // iOS: try app, fallback to web
    window.location.href = 'fb-messenger://share?text=' + encoded;
    setTimeout(()=>{ window.open('https://www.messenger.com/t/me', '_blank'); }, 1500);
  } else if(isAndroid){
    window.location.href = 'intent://share/#Intent;scheme=fb-messenger;package=com.facebook.orca;end';
    setTimeout(()=>{ window.open('https://www.messenger.com', '_blank'); }, 1500);
  } else {
    // Desktop: open messenger web
    window.open('https://www.messenger.com', '_blank');
  }
  showToast('📋 Szöveg másolva! Illeszd be a csoportba.');
}
